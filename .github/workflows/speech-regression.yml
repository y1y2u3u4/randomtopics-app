name: Speech regression
on:
  pull_request:
    paths:
      - 'src/lib/speech/**'
      - 'src/app/api/speech/**'
      - 'src/components/Speech*.tsx'
      - 'src/lib/adsense*.ts'
      - 'src/lib/adConsent.ts'
      - 'src/lib/usAdSignal.ts'
      - 'src/components/ArticleAdvertisement.tsx'
      - 'scripts/adsense-*.mjs'
      - 'scripts/us-ad-signal-regression.mjs'
      - 'scripts/speech-*.mjs'
      - 'scripts/lib/load-typescript.mjs'
      - 'package*.json'
      - '.github/workflows/speech-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/speech/**'
      - 'src/app/api/speech/**'
      - 'src/components/Speech*.tsx'
      - 'src/lib/adsense*.ts'
      - 'src/lib/adConsent.ts'
      - 'src/lib/usAdSignal.ts'
      - 'src/components/ArticleAdvertisement.tsx'
      - 'scripts/adsense-*.mjs'
      - 'scripts/us-ad-signal-regression.mjs'
      - 'scripts/speech-*.mjs'
      - 'scripts/lib/load-typescript.mjs'
      - 'package*.json'
      - '.github/workflows/speech-regression.yml'
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run speech:test
      - run: npm run billing:test
      - run: npm run ads:test
      - run: npx eslint src/lib/speech/server.ts src/lib/speech/diagnostics.ts scripts/speech-transcription-regression.mjs
